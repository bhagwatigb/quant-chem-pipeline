services:
  pipeline:
    build: .
    image: quant-chem-pipeline:latest
    container_name: quant-chem-pipeline
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./quant_chem:/app/quant_chem
      - ./.free_models_cache.json:/app/.free_models_cache.json

